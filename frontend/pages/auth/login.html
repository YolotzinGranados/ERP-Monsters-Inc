<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterInc ERP — Iniciar sesión</title>
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <span class="brand-icon">🦾</span>
                <h1>MonsterERP</h1>
                <p>Accede a tu panel de control</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="tu@empresa.com" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Iniciar sesión</button>
            </form>

            <p id="message" class="login-message" aria-live="polite"></p>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
</body>

</html>
